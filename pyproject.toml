[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parellel-lru"
version = "0.1.0"
description = "Custom GPU kernels for parallel-scan LRU."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]
